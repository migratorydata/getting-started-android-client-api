apply plugin: 'com.android.application'

android {
    compileSdkVersion = 34

    defaultConfig {
        applicationId "com.migratorydata.androidexampleapplication"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.migratorydata.androidexampleapplication'
}

dependencies {
    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'com.android.support:appcompat-v7:28.0.0'
    testImplementation 'junit:junit:4.12'

    // https://mvnrepository.com/artifact/com.migratorydata/client-java-api
    implementation group: 'com.migratorydata', name: 'client-java-api', version: '6.0.8'
}

